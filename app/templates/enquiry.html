<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make an Enquiry | Heritage Hotel</title>
<style>
:root{--ink:#203027;--gold:#c7a66a;--muted:#6e756d}*{box-sizing:border-box}
body{margin:0;padding:35px 18px;background:linear-gradient(135deg,#17251f,#34483b);color:var(--ink);font-family:Arial,sans-serif}
.wrap{max-width:680px;margin:auto}.back{display:inline-block;color:#f2dfbd;margin:0 0 20px;font-size:14px}
main{background:white;border-radius:14px;padding:clamp(24px,5vw,48px);box-shadow:0 20px 60px #0003}
.eyebrow{color:#a77e3e;font-size:11px;letter-spacing:3px;text-transform:uppercase}
h1{font:400 clamp(34px,5vw,48px) Georgia,serif;margin:12px 0;color:#203027}.hint{color:var(--muted);line-height:1.7;margin-bottom:26px}
label{display:block;margin:17px 0 7px;font-weight:600;font-size:13px;color:#344238}
input,textarea{width:100%;padding:13px;border:1px solid #d5d9d2;border-radius:6px;font:inherit;background:white}
input:focus,textarea:focus{outline:2px solid #d6bd8c;border-color:#a77e3e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
button{width:100%;margin-top:24px;padding:16px;border:0;border-radius:5px;background:#b88f50;color:#17251f;font-weight:700;letter-spacing:1px;cursor:pointer}
button:hover{background:#d3b477}#result{margin-top:18px;font-weight:600;line-height:1.6}
@media(max-width:540px){.grid{grid-template-columns:1fr;gap:0}}
</style></head><body><div class="wrap">
<a class="back" href="/">← Back to home</a><main>
<div class="eyebrow">We look forward to welcoming you</div><h1>Make an enquiry</h1>
<p class="hint">Share your stay details below. Our team will follow up to confirm availability. Submitting this form sends an enquiry, not a confirmed reservation.</p>
<form id="booking-form">
<label for="guest_name">Guest name</label><input id="guest_name" name="guest_name" required maxlength="120" autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email">
<div class="grid"><div><label for="check_in">Check-in</label><input id="check_in" name="check_in" type="date" required></div>
<div><label for="check_out">Check-out</label><input id="check_out" name="check_out" type="date" required></div></div>
<label for="guests">Guests (1–12)</label><input id="guests" name="guests" type="number" min="1" max="12" value="1" required>
<label for="message">Additional requests</label><textarea id="message" name="message" rows="3" maxlength="1000"></textarea>
<button type="submit">Send enquiry</button></form><p id="result" role="status" aria-live="polite"></p>
</main></div>
<script>
document.getElementById('booking-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const bookingForm = event.currentTarget;
  const payload = Object.fromEntries(new FormData(bookingForm).entries());
  payload.guests = Number(payload.guests);
  const result = document.getElementById('result');
  result.textContent = 'Sending…';
  try {
    const response = await fetch('/api/bookings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({error:'Server returned an invalid response.'}));
    if (!response.ok) { result.textContent = `Could not submit: ${data.error || 'Unknown server error'}`; return; }
    result.textContent = `Enquiry received. Reference: ${data.booking.id}`;
    bookingForm.reset();
  } catch (error) {
    console.error('Enquiry submission failed:', error);
    result.textContent = `Request failed: ${error.message}`;
  }
});
</script></body></html>
