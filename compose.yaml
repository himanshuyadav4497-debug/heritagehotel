
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    build: .
    command:
      - python
      - -c
      - "from app import create_app, db; app=create_app(); ctx=app.app_context(); ctx.push(); db.create_all(); ctx.pop()"
    environment:
      DATABASE_URL: postgresql+psycopg://hotel:${POSTGRES_PASSWORD:-localdev_only_change_me}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://hotel:${POSTGRES_PASSWORD:-localdev_only_change_me}@db:5432/hotel
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
